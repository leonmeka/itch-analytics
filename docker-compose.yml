name: scratch

services:
  db:
    image: postgres:16-alpine
    container_name: scratch-db
    environment:
      POSTGRES_USER: scratch
      POSTGRES_PASSWORD: scratch
      POSTGRES_DB: scratch
    ports:
      - "5432:5432"
    volumes:
      - scratch_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scratch -d scratch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: scratch-api
    ports:
      - "8000:8000"
    environment:
      API_PORT: 8000
      API_DATABASE_URL: postgres://scratch:scratch@db:5432/scratch
    env_file:
      - .env
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/tsconfig.app.json:/app/apps/api/tsconfig.app.json
      - ./libs:/app/libs
    command: sh -c "pnpm --filter @scratch/shared run apply && exec pnpm --filter @scratch/api run dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  scratch_db_data:
    name: scratch_pg
